name: Unit Tests

on:
  push:
    branches: [ main, unit_test_debugging ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Run the job inside your pre-built container image
    container:
      image: ghcr.io/${{ github.repository_owner }}/ros2-ci-environment:latest
      options: --user root

    defaults:
      run:
        shell: bash -e {0}

    steps:
      # Step 1: Clone current (primary) repository into ros_ws/src/primary_repo
      - name: Checkout primary repo
        uses: actions/checkout@v4
        with:
          path: arm_ros2_ws/src/rsx_arm

      # Step 2: Clone second repository into ros_ws/src/second_repo
      - name: Checkout secondary repo
        uses: actions/checkout@v4
        with:
          repository: rsx-utoronto/trac_ik_humble # Replace with your target repo (e.g., my-org/other-pkg)
          token: ${{ secrets.EXTRA_REPO_PAT }} # GitHub Personal Access Token if repo is private
          path: arm_ros2_ws/src/second_repo

      # Step 3: Build the ROS 2 Workspace
      - name: Build Workspace
        run: |
          source /opt/ros/humble/setup.bash
          cd arm_ros2_ws
          colcon build --symlink-install

      # Step 4: Run specified unit tests & enforce pass/fail criteria
      - name: Run Unit Tests
        run: |
          source /opt/ros/humble/setup.bash
          cd arm_ros2_ws
          source install/setup.bash

          # Run colcon test
          colcon test --ctest-args tests --packages-skip arm_msgs 

          # Fail the job if any unit test failed
          colcon test-result --all --verbose